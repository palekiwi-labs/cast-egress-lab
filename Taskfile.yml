version: "3"

# HOST tasks need docker and run on the host.
# SERVICE tasks run inside the lab cast service (`cast shell`).

env:
  LAB_PRIVATE_REPO: '{{env "LAB_PRIVATE_REPO" | default "palekiwi/palekiwi"}}'
  PI_PROBE_ARGS: '{{env "PI_PROBE_ARGS" | default "--model google/gemini-3.8-flash"}}'

tasks:
  proxy:up:
    desc: "[host] create lab network and mitmproxy container"
    cmds: [host/proxy.sh up]
  proxy:down:
    desc: "[host] remove proxy container and lab network"
    cmds: [host/proxy.sh down]
  proxy:status:
    desc: "[host] show proxy container and network members"
    cmds: [host/proxy.sh status]
  proxy:logs:
    desc: "[host] follow egress.jsonl"
    cmds: [host/proxy.sh logs]

  stage:1:
    desc: "[host] opt this repo in to stage 1 (then cast down && cast up)"
    cmds: [cp stages/1-soft/cast.local.json stages/1-soft/cast.env .]
  proxy:up:mitm:
    desc: "[host] proxy with TLS interception and GH token injection"
    cmds: [LAB_MODE=mitm host/proxy.sh up]
  stage:2:
    desc: "[host] opt this repo in to stage 2 (then cast down && cast up)"
    cmds: [cp stages/2-mitm/cast.local.json stages/2-mitm/cast.env .]
  proxy:up:internal:
    desc: "[host] internal network, mitm proxy, host forwarders"
    cmds: [LAB_MODE=internal host/proxy.sh up]
  stage:3:
    desc: "[host] opt this repo in to stage 3 (then cast down && cast up)"
    cmds: [cp stages/3-internal/cast.local.json stages/3-internal/cast.env .]
  stage:off:
    desc: "[host] opt this repo out (then cast down && cast up)"
    cmds: [rm -f cast.local.json cast.env]

  probe:
    desc: "[service] run all probes through the configured proxy"
    cmds: [probes/run-all.sh]
  probe:mitm:
    desc: "[service] stage 2 probes: TLS trust, injection, leak, exfil"
    cmds: [LAB_PROBES="curl gh git pi claude gh-auth git-private jira leak exfil" probes/run-all.sh]
  probe:internal:
    desc: "[service] stage 3 probes: stage 2 set plus isolation, DNS, forwarders"
    cmds: [LAB_PROBES="direct dns hostfwd acuity node curl gh git pi claude gh-auth git-private jira leak exfil" probes/run-all.sh]
  probe:fwd:
    desc: "[service] host forwarders: MCP, QA app, agent-browser"
    cmds: [LAB_PROBES="hostfwd acuity mcp browser" probes/run-all.sh]
  probe:blackhole:
    desc: "[service] run all probes with proxy vars pointed at a dead port"
    cmds: [probes/run-all.sh --blackhole]
